name: DB Integration Tests

# Runs the SQL integration suite (supabase/tests/*.test.sql) on a disposable
# Supabase database:
#
#   default — the Supabase CLI's LOCAL docker stack: fresh containers, all
#             migrations pushed, suite executed, stack discarded. Needs no
#             secrets and works on any Supabase plan.
#   branch  — a disposable SUPABASE CLOUD BRANCH (requires the Pro plan and
#             the SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets).
#
# Triggered on PRs touching supabase/** and by manual dispatch.

on:
  pull_request:
    branches: [master]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'scripts/test-db.sh'
      - '.github/workflows/db-integration.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Database mode'
        type: choice
        default: local
        options: [local, branch]

concurrency:
  group: db-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  settlement-effects:
    runs-on: ubuntu-latest
    env:
      TEST_DB_MODE: ${{ inputs.mode || 'local' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Warn when branch mode is requested without secrets
        if: env.TEST_DB_MODE == 'branch' && (env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_PROJECT_REF == '')
        run: |
          echo "::warning::TEST_DB_MODE=branch needs SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF secrets (and the Supabase Pro plan). Falling back to the local docker stack."
          echo "TEST_DB_MODE=local" >> "$GITHUB_ENV"

      - name: Run settlement suite on a disposable database
        run: bash scripts/test-db.sh
